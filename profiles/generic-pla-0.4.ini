# FEMOS digital-pipeline proof profile, PrusaSlicer 2.9.6.
# Generic Marlin PLA, 200x200 mm bed, 0.4 mm nozzle. NOT certified for any
# physical printer. The current FEMOS print adapter is simulated only.
bed_shape = 0x0,200x0,200x200,0x200
nozzle_diameter = 0.4
layer_height = 0.2
first_layer_height = 0.2
filament_diameter = 1.75
filament_density = 1.24
temperature = 210
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 60
gcode_flavor = marlin
start_gcode = G28 ; home axes\nG92 E0 ; reset extruder
end_gcode = M104 S0 ; heater off\nM140 S0 ; bed heater off\nM84 ; motors off
